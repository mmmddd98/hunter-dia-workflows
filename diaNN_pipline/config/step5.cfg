# config/step5.cfg
# Step 5 specific overrides (final search/quant)

LIB=""
STEP5_REPORT_QVALUE=1       # DIA-NN main report export threshold; analysis QVALUE stays 0.01 by default
enable_REPORT_DECOYS=1      # ==> --report-decoys
enable_FASTA_SEARCH=1  # ==> --fasta-search
enable_MATRICES=1  # ==> --matrices
enable_GEN_SPEC_LIB=1  # ==> --gen-spec-lib
enable_CONT-QUANT-EXQCLUDE_CRAP=1  # ==> --cont-quant-exclude cRAP
enable_REANALYSE=1  # ==> --reanalyse
enable_RT-PROFILING=1  # ==> --rt-profiling
# enables protein N-term methionine excision as variable modification for the in silico digest
enable_PRE_SEARCH=0

# data evaluation + visualization
enable_eval_run_arabidopsis_reference=0
eval_arabidopsis_reference_python_file="${EVAL_ARABIDOPSIS_REFERENCE_PYTHON_FILE:-}"
eval_parquet_file="final_report.parquet"
enable_eval_run_ecoli_centered=0
eval_ecoli_centered_python_file="${EVAL_ECOLI_CENTERED_PYTHON_FILE:-}"
eval_tsv_file="final_report.stats.tsv"
eval_python_path="${EVAL_PYTHON_PATH:-python3}"
