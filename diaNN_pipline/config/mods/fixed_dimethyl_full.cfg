# Modification preset with fixed UniMod:510 / Dimethyl:2H(4)13C(2).
#
# Fixed:
# - UniMod:4 / Carbamidomethyl (+57.021464) on C
# - UniMod:510 / Dimethyl:2H(4)13C(2) (+34.063117) on K and peptide N-term
#
# Variable:
# - UniMod:35 / Oxidation (+15.994915) on M
# - Acetyl_delta_after_fixed_UniMod510 (+7.947448) on K and peptide N-term
#   Delta mass = UniMod:1 Acetyl (+42.010565) - UniMod:510 (+34.063117)

enable_UNIMOD4=0
VAR_MODS=2

FIXED_MODS_LIST=(
  "UniMod:4,57.021464,C"
  "UniMod:510,34.063117,nK"
)

VAR_MODS_LIST=(
"UniMod:35,15.994915,M" # Oxidation on M

"Acetyl_delta_after_fixed_UniMod510,7.947448,nK" # Acetyl delta after fixed UniMod:510: UniMod:1 Acetyl (+42.010565) - UniMod:510 (+34.063117)
"Nterm_NH3_loss_delta_after_fixed_UniMod510,-51.089666,n" # N-terminal NH3-loss delta after fixed UniMod:510: -17.026549 - 34.063117; post-filter: keep only peptides starting with Q or C; Q => UniMod:28 Gln->pyro-Glu, C => UniMod:385 Ammonia-loss / pyro-carbamidomethyl-related case
"UniMod:27_delta_after_fixed_UniMod510,-52.073682,n" # Glu->pyro-Glu delta after fixed UniMod:510: UniMod:27 (-18.010565) - UniMod:510 (+34.063117); post-filter: keep only peptides starting with E
"Nterm_Proline_monomethyl_delta_after_fixed_UniMod510,-17.031559,n" # N-terminal Proline special case: one heavy methyl instead of fixed heavy dimethyl; approx +17.031558 - 34.063117; post-filter: keep only peptides starting with P
)
