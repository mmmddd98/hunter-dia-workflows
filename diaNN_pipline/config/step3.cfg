# config/step3.cfg
# Step 3 specific overrides (tune models)
enable_PRE_SEARCH=1

# primary control (recommended): choose which dimensions to tune
# allowed: all|rt|im|fr|rt,fr|rt,im|fr,im|rt,im,fr
# default recommendation: rt,fr
TUNE_TARGETS=rt,fr

# optional instrument hint for IM gating. IM tuning is only active for timstof.
# usually set automatically by run_all.sh from dataset acquisition.instrument
# INSTRUMENT=timstof

TUNE_LR=0.0005   # README default
