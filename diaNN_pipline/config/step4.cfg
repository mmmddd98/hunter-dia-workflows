# config/step4.cfg
# Step 4 specific overrides (refined/tuned predicted library)

# keep Step4 in "no pre-search" mode by default
enable_PRE_SEARCH=0

LIB=""
enable_FASTA_SEARCH=1
enable_MATRICES=1
enable_GEN_SPEC_LIB=1
enable_CONT_QUANT_EXQCLUDE_CRAP=1
enable_REANALYSE=1
enable_RT_PROFILING=1
enable_REANNOTATE=1
enable_SEMI=1
enable_PEPTIDOFORMS=1
enable_UNIMOD4=1

# run_all Step4 selection controls
# STEP4_MODEL_TARGETS syntax:
#   all
#   rt
#   rt+fr
#   rt,rt+fr
# available model dimensions: rt, im, fr
STEP4_MODEL_TARGETS=all

# which LR folders from Step3 to consume
# all     -> all lr_* folders for each selected profile
# default -> first available lr_* folder (sorted)
# list/range syntax supported via run_all --set (same as Step3 TUNE_LR):
#   0.0005,0.001  or  0.0005:0.002:0.0005
STEP4_LR_SELECT=all

# Distillation level(s) to consume from Step3 model outputs.
# DIA-NN 2.5.0 can write .d0/.d1/.d2 model variants.
# Allowed values: 0, 1, 2, comma-separated list (e.g. 0,1,2).
# Default: 0
STEP4_DISTILL_LEVELS=0

# base output folder name below OUTBASE/<expname>/
STEP4_BASEDIR_NAME=04_refined_lib_no_presearch
