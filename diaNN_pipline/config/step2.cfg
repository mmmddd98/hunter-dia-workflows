# config/step2.cfg
# Step 2 specific overrides (tunelib)

enable_PRE_SEARCH=1

# Required for Carafe jobs: DIA-NN writes the MS2.Scan column used to map
# identifications to training mzML scans. Harmless for non-Carafe Step-2 runs.
enable_EXPORT_QUANT=1
# FASTA is required for Step 2; either set it here or pass --fasta/--fastaabs.
# FASTA=my_database.fasta
# FASTA=/absolute/path/to/my_database.fasta

# Default calibration mode for Step 2 (parameter-based):
# Used when running Step 2 with: --caltype fixed
MASS_ACC_CAL=15
MIN_CAL=500

# Calibration method A (reference file):
# Optional override via CLI:
#   --ref /path/to/calib_ref.parquet
# If --caltype is NOT set, Step 2 runs in ref mode.
# If --ref is omitted in ref mode, Step 2 tries:
#   OUTBASE/<expname>/cal_lib/calib_ref.parquet
# Calibration method B (parameters, no --ref):
#   use --caltype fixed
# IMPORTANT: keep enable_PRE_SEARCH=1 for calibration.
