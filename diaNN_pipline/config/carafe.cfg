# Carafe 2 preparation defaults.
#
# These values are copied into every prepared job and can be overridden with
# prepare_carafe_job.sh --set CARAFE_<KEY>=<VALUE>. The later GPU runner will
# map these values to the documented Carafe CLI options.

# The real Carafe job lives on a filesystem shared by the analysis host and the GPU host.
# the analysis host receives a symlink below the source experiment pointing here.
CARAFE_SHARE_ROOT="${CARAFE_SHARE_ROOT:-./shared_data/carafe_share}"
CARAFE_STEP_DIR_NAME="${CARAFE_STEP_DIR_NAME:-carafe}"
CARAFE_JOB_ROOT="${CARAFE_JOB_ROOT:-}"
CARAFE_STAGE_MODE="${CARAFE_STAGE_MODE:-symlink}"  # symlink | copy
CARAFE_HASH_RAW_FILES="${CARAFE_HASH_RAW_FILES:-0}"  # SHA-256 is expensive for mzML files

# Both computers access the same shared job directory directly. The generated
# helper scripts validate the shared inputs and intentionally do not rsync.
CARAFE_GPU_HOST="${CARAFE_GPU_HOST:-}"
CARAFE_GPU_JOB_ROOT="${CARAFE_GPU_JOB_ROOT:-./carafe_jobs}"
CARAFE_CPU_HOST="${CARAFE_CPU_HOST:-}"
CARAFE_SHARED_INPUT_PATHS="${CARAFE_SHARED_INPUT_PATHS:-1}"

# The GPU runner records GPU, process, host-memory and shared-filesystem
# telemetry at this interval while a real Carafe run is active.
CARAFE_RESOURCE_INTERVAL_SECONDS="${CARAFE_RESOURCE_INTERVAL_SECONDS:-30}"

# Input filtering and XIC extraction.
CARAFE_FDR="${CARAFE_FDR:-0.01}"
CARAFE_CORRELATION="${CARAFE_CORRELATION:-0.75}"
CARAFE_PTM_SITE_PROB="${CARAFE_PTM_SITE_PROB:-0.75}"
CARAFE_PTM_SITE_QVALUE="${CARAFE_PTM_SITE_QVALUE:-1}"
CARAFE_FRAGMENT_TOLERANCE="${CARAFE_FRAGMENT_TOLERANCE:-20}"
CARAFE_FRAGMENT_TOLERANCE_UNIT="${CARAFE_FRAGMENT_TOLERANCE_UNIT:-ppm}"
CARAFE_XIC_SMOOTHING_POINTS="${CARAFE_XIC_SMOOTHING_POINTS:-3}"
CARAFE_MIN_MATCHED_FRAGMENTS="${CARAFE_MIN_MATCHED_FRAGMENTS:-4}"
CARAFE_ADJACENT_SCANS="${CARAFE_ADJACENT_SCANS:-0}"
CARAFE_MIN_FRAGMENT_MZ="${CARAFE_MIN_FRAGMENT_MZ:-200}"
CARAFE_MIN_HIGH_QUALITY_FRAGMENTS="${CARAFE_MIN_HIGH_QUALITY_FRAGMENTS:-4}"
CARAFE_RT_WINDOW_OFFSET="${CARAFE_RT_WINDOW_OFFSET:-1}"
CARAFE_MAX_RT="${CARAFE_MAX_RT:-0}"
CARAFE_REFINE_RT_WINDOW="${CARAFE_REFINE_RT_WINDOW:-}"

# Optional extraction switches: 1 passes the respective Carafe flag, 0 omits it.
CARAFE_NORMALIZE_INTENSITY="${CARAFE_NORMALIZE_INTENSITY:-0}"  # -nm
CARAFE_LIMIT_FRAGMENT_CHARGE="${CARAFE_LIMIT_FRAGMENT_CHARGE:-0}"  # -cs
CARAFE_EXPORT_FRAGMENT_MZ="${CARAFE_EXPORT_FRAGMENT_MZ:-0}"  # -ez
CARAFE_EXPORT_SKYLINE="${CARAFE_EXPORT_SKYLINE:-0}"  # -skyline
CARAFE_ONLY_VALID_MATCHES="${CARAFE_ONLY_VALID_MATCHES:-0}"  # -valid
CARAFE_USE_ALL_PEAKS="${CARAFE_USE_ALL_PEAKS:-0}"
CARAFE_REFINE_PEAK_BOUNDARY="${CARAFE_REFINE_PEAK_BOUNDARY:-0}"  # -rf
CARAFE_EXPORT_XIC="${CARAFE_EXPORT_XIC:-0}"
CARAFE_EXPORT_MGF="${CARAFE_EXPORT_MGF:-0}"
CARAFE_NO_PEAK_MASKING="${CARAFE_NO_PEAK_MASKING:-0}"
CARAFE_EXCLUDE_Y1="${CARAFE_EXCLUDE_Y1:-0}"
CARAFE_I2L="${CARAFE_I2L:-0}"
CARAFE_CLIP_NTERM_M="${CARAFE_CLIP_NTERM_M:-0}"
CARAFE_FAST_IO="${CARAFE_FAST_IO:-1}"
CARAFE_TORCH_COMPILE="${CARAFE_TORCH_COMPILE:-0}"
CARAFE_CCS="${CARAFE_CCS:-0}"
# Save a model snapshot after each validation evaluation when set to 1. This is
# off by default because it writes one model file per epoch and model type.
CARAFE_SAVE_VALIDATION_CHECKPOINTS="${CARAFE_SAVE_VALIDATION_CHECKPOINTS:-0}"

# Protein digestion and precursor space. The defaults match the current
# fixed_lysin_dimethyl DIA-NN setup (Arg-C without the Pro rule, R*).
CARAFE_ENZYME="${CARAFE_ENZYME:-4}"
CARAFE_MISSED_CLEAVAGES="${CARAFE_MISSED_CLEAVAGES:-1}"
# This workflow is semi-specific by default. The GPU runner passes Carafe2-semi's
# -semi flag and the final-search runner passes DIA-NN's --semi.
CARAFE_SEMI_SPECIFIC="${CARAFE_SEMI_SPECIFIC:-1}"
CARAFE_MIN_PEPTIDE_LENGTH="${CARAFE_MIN_PEPTIDE_LENGTH:-7}"
CARAFE_MAX_PEPTIDE_LENGTH="${CARAFE_MAX_PEPTIDE_LENGTH:-30}"
CARAFE_MIN_PRECURSOR_MZ="${CARAFE_MIN_PRECURSOR_MZ:-300}"
CARAFE_MAX_PRECURSOR_MZ="${CARAFE_MAX_PRECURSOR_MZ:-1800}"
CARAFE_MIN_PRECURSOR_CHARGE="${CARAFE_MIN_PRECURSOR_CHARGE:-1}"
CARAFE_MAX_PRECURSOR_CHARGE="${CARAFE_MAX_PRECURSOR_CHARGE:-4}"

# Carafe PTM IDs from `carafe-2.2.0.jar -printPTM`.
# 1   = Carbamidomethyl C (UniMod:4)
# 479 = Dimethyl:2H(4)13C(2) K (UniMod:510)
# 2   = Oxidation M (UniMod:35)
# 480 = Dimethyl:2H(4)13C(2) peptide N-term (UniMod:510)
# 31  = Acetyl peptide N-term (UniMod:1)
CARAFE_FIXED_MODS="${CARAFE_FIXED_MODS:-1,479}"
CARAFE_VARIABLE_MODS="${CARAFE_VARIABLE_MODS:-2,480,31}"
CARAFE_MAX_VARIABLE_MODS="${CARAFE_MAX_VARIABLE_MODS:-2}"
CARAFE_USER_VARIABLE_MODS="${CARAFE_USER_VARIABLE_MODS:-}"
CARAFE_MOD_MASS_OVERRIDES="${CARAFE_MOD_MASS_OVERRIDES:-}"
CARAFE_TEMPLATE_MOD_CONFIG="${CARAFE_TEMPLATE_MOD_CONFIG:-fixed_lysin_dimethyl}"

# Model training and spectral-library export.
CARAFE_DATA_TYPE="${CARAFE_DATA_TYPE:-DIA}"
CARAFE_SEARCH_ENGINE="${CARAFE_SEARCH_ENGINE:-DIA-NN}"
CARAFE_MODE="${CARAFE_MODE:-general}"
CARAFE_TUNE_TYPE="${CARAFE_TUNE_TYPE:-all}"  # ms2 | rt | all
CARAFE_RANDOM_SEED="${CARAFE_RANDOM_SEED:-2024}"
CARAFE_AI_VERSION="${CARAFE_AI_VERSION:-v2}"
CARAFE_DEVICE="${CARAFE_DEVICE:-gpu}"
CARAFE_MS_INSTRUMENT="${CARAFE_MS_INSTRUMENT:-Exploris}"
CARAFE_NCE="${CARAFE_NCE:-}"
CARAFE_MODEL_DIR="${CARAFE_MODEL_DIR:-}"
CARAFE_MS2_MODEL="${CARAFE_MS2_MODEL:-}"
CARAFE_PYTHON="${CARAFE_PYTHON:-python}"
CARAFE_VERBOSE="${CARAFE_VERBOSE:-2}"
# Final Parquet assembly uses bounded CPU workers after streaming matrix reads.
# Two workers are safe for the GPU-PC setup; CCS assembly remains sequential.
CARAFE_ASSEMBLY_WORKERS="${CARAFE_ASSEMBLY_WORKERS:-2}"
CARAFE_LIBRARY_TYPE="${CARAFE_LIBRARY_TYPE:-DIA-NN}"
# CARAFE writes its native fragment library as Parquet. A subsequent
# compatibility step upgrades its schema for DIA-NN 2.x when required.
CARAFE_LIBRARY_FORMAT="${CARAFE_LIBRARY_FORMAT:-parquet}"
CARAFE_DIANN2_PARQUET="${CARAFE_DIANN2_PARQUET:-1}"
# A known-good DIA-NN 2.x library whose schema is used by the post-assembly
# converter. The converted library is written next to CARAFE's raw library.
CARAFE_DIANN_REFERENCE_LIBRARY="${CARAFE_DIANN_REFERENCE_LIBRARY:-./shared_data/250_speclib_save/lib.parquet}"
CARAFE_LIBRARY_MIN_FRAGMENT_MZ="${CARAFE_LIBRARY_MIN_FRAGMENT_MZ:-200}"
CARAFE_LIBRARY_MAX_FRAGMENT_MZ="${CARAFE_LIBRARY_MAX_FRAGMENT_MZ:-1800}"
CARAFE_LIBRARY_TOP_N_FRAGMENTS="${CARAFE_LIBRARY_TOP_N_FRAGMENTS:-20}"
CARAFE_LIBRARY_MIN_N_FRAGMENTS="${CARAFE_LIBRARY_MIN_N_FRAGMENTS:-2}"
CARAFE_LIBRARY_FRAGMENT_N_MIN="${CARAFE_LIBRARY_FRAGMENT_N_MIN:-2}"
CARAFE_NTERM_ION_MIN="${CARAFE_NTERM_ION_MIN:-0}"
CARAFE_CTERM_ION_MIN="${CARAFE_CTERM_ION_MIN:-0}"

# Names inside one prepared job. These paths are deliberately relative, so a
# job can be copied unchanged to the GPU machine.
CARAFE_INPUT_DIR_NAME="${CARAFE_INPUT_DIR_NAME:-input}"
CARAFE_OUTPUT_DIR_NAME="${CARAFE_OUTPUT_DIR_NAME:-carafe_output}"
CARAFE_LIBRARY_BASENAME="${CARAFE_LIBRARY_BASENAME:-carafe_library}"
# Final-search library staging: refresh the local copy before each search by
# default so a new shared Carafe library cannot be mixed with an old .quant run.
CARAFE_RECOPY_LIBRARY="${CARAFE_RECOPY_LIBRARY:-1}"
