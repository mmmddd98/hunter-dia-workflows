# Copy to config/carafe_machines/<machine>.local.cfg and set CARAFE_MACHINE to
# <machine>.local when the GPU runner is added.

CARAFE_JAVA="/path/to/conda/envs/carafe2/lib/jvm/bin/java"
CARAFE_JAR="/path/to/carafe-2.2.0/carafe-2.2.0.jar"
# Every real run stages an immutable JAR copy here. Keep this on local storage,
# never inside the shared Carafe job directory.
CARAFE_RUNTIME_ROOT="/tmp/carafe2-runtime"
# Semi-specific library generation can hold millions of peptide isoforms in
# memory. Tune this per machine; 96 GB leaves headroom on the GPU workstation.
CARAFE_JAVA_OPTS="-Xms16G -Xmx96G"

# Required when a prepared job contains Thermo .raw training files. Carafe's
# CLI reads mzML, so the runner converts RAW inputs once and caches the mzMLs
# inside the shared job. Point this at the executable in the thermoraw env.
CARAFE_THERMORAW_PARSER="/path/to/conda/envs/thermoraw/bin/thermorawfileparser"
# Matches thermo_raw_file_parser_test/commands.txt: indexed mzML (-f=2), no
# zlib compression (-z), native Thermo peak picking enabled (no -p).
CARAFE_THERMORAW_FORMAT="2"
CARAFE_THERMORAW_NO_ZLIB="1"
CARAFE_THERMORAW_PEAK_PICKING="1"

# Both machines must see this directory at this exact path.
CARAFE_SHARE_ROOT="./shared_data/carafe_share"
CARAFE_RAW_MODE="share"
CARAFE_SHARED_INPUT_PATHS="1"

# The shared storage must expose this exact path on the GPU host.
CARAFE_SHARED_STORAGE="./shared_data"
