# config/entrapment.cfg
# Defaults for creating combined original+shuffled entrapment FASTA files.

# fixed-r: keep arginine (R) positions and the first amino acid fixed, shuffle all
#          other amino acids within each protein.
# simple : legacy behaviour; keep the first amino acid fixed and shuffle the rest.
FASTA_ENTRAP_SHUFFLE_MODE=fixed-r

# Random seed for deterministic entrapment FASTA generation.
FASTA_ENTRAP_SEED=1337
