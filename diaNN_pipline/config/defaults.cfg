# config/defaults.cfg
THREADS="${THREADS:-24}"
QVALUE=0.01                 # analysis/report filter; keep historical 1% default
STEP5_REPORT_QVALUE=1       # DIA-NN Step5 export threshold for final_report
enable_REPORT_DECOYS=1      # keep DIA-NN decoy rows in Step5 final_report

# digestion / search space
CUT="R*" # Arginine-specific cleavage; dimethylated lysines are excluded as cleavage sites.
MISSED_CLEAVAGES=1  # ==> --missed-cleavages 1
MIN_PEP_LEN=7 # ==> --min-peptide-len 7
MAX_PEP_LEN=30 # ==> --max-peptide-len 30
MIN_PR_CHARGE=1 # ==> --min-pr-charge 1
MAX_PR_CHARGE=4 # ==> --max-pr-charge 4

MIN_FR_MZ=200 # ==> --min-fr-mz 200
MAX_FR_MZ=1800 # ==> --max-fr-mz 1800

MIN_PR_MZ=300 # ==> --min-pr-mz 300
MAX_PR_MZ=1800 # ==> --max-pr-mz 1800

# modifications
# Load one preset from config/mods/<MOD_CONFIG>.cfg.
# Use --mods <name> or --set MOD_CONFIG=<name> to select another preset.
MOD_CONFIG=standard
enable_UNIMOD4=0                # presets declare Carbamidomethyl explicitly as --fixed-mod


#on off arguments
enable_REANNOTATE=1  # ==> --reannotate
enable_SEMI=1  # ==> --semi
enable_PEPTIDOFORMS=1  # ==> --peptidoforms

# Always include quant export in DIA-NN calls triggered via the pipeline.
if [[ " ${EXTRA_FLAGS:-} " != *" --export-quant "* ]]; then
  EXTRA_FLAGS="${EXTRA_FLAGS:+${EXTRA_FLAGS} }--export-quant"
fi

# RAM logging (default: enabled for all steps, sampled every 10s)
RAM_LOG_ENABLE=1               # 1=on, 0=off
RAM_LOG_STEPS=all              # all | step1,make_cal,step2,step3,step4,step5 | comma-separated subset
RAM_LOG_INTERVAL=10            # sampling interval in seconds

DATASET_TYPE=prehunter # "prehunter" or "hunter"; use --set DATASET_TYPE=... to override

# Set to 1 or pass run_all.sh --no-cal-lib to skip make_cal_lib completely.
# Downstream steps then do not expect cal_lib paths and do not pass --ref.
NO_CAL_LIB=0

# MA plot report after Step 5 in run_all.sh
ENABLE_MAPLOT_REPORT=1
MAPLOT_PYTHON_PATH="${MAPLOT_PYTHON_PATH:-python3}"
MAPLOT_REPORT_SCRIPT="${MAPLOT_REPORT_SCRIPT:-${PIPELINE_ROOT}/../diann_visu/post_run_reports/scripts/run_maplot_report.py}"
MAPLOT_ORGANISM=auto
MAPLOT_MAX_MOD_UPSETS=6
MAPLOT_REUSE_CACHE=0
MAPLOT_PSSM_PREDICTION=0
