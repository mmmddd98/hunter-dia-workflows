# config/paths.cfg
#
# Load paths and executables for the selected machine. Keep this file free of
# host-specific values; those belong in config/machines/<name>.cfg.

PIPELINE_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"

PIPELINE_ENV_FILE="${PIPELINE_ROOT}/.env"
if [[ -f "$PIPELINE_ENV_FILE" ]]; then
  _diann_allexport_was_set=0
  case "$-" in
    *a*) _diann_allexport_was_set=1 ;;
  esac
  set -a
  # shellcheck source=/dev/null
  source "$PIPELINE_ENV_FILE"
  if [[ "$_diann_allexport_was_set" != "1" ]]; then
    set +a
  fi
  unset _diann_allexport_was_set
fi

DIANN_MACHINE="${DIANN_MACHINE:-local}"
if [[ ! "$DIANN_MACHINE" =~ ^[A-Za-z0-9._-]+$ ]]; then
  echo "ERROR: Invalid DIANN_MACHINE '${DIANN_MACHINE}'." >&2
  return 1 2>/dev/null || exit 1
fi

DIANN_MACHINE_CONFIG="${PIPELINE_ROOT}/config/machines/${DIANN_MACHINE}.cfg"
if [[ ! -f "$DIANN_MACHINE_CONFIG" ]]; then
  echo "ERROR: Machine config not found: ${DIANN_MACHINE_CONFIG}" >&2
  echo "Set DIANN_MACHINE to a file name from config/machines (without .cfg)." >&2
  return 1 2>/dev/null || exit 1
fi

# shellcheck source=/dev/null
source "$DIANN_MACHINE_CONFIG"

: "${DIANN_BIN:?DIANN_BIN is missing in ${DIANN_MACHINE_CONFIG}}"
: "${RAWBASE:?RAWBASE is missing in ${DIANN_MACHINE_CONFIG}}"
: "${FASTABASE:?FASTABASE is missing in ${DIANN_MACHINE_CONFIG}}"
: "${DATASET_ROOT:?DATASET_ROOT is missing in ${DIANN_MACHINE_CONFIG}}"
: "${OUTROOT:?OUTROOT is missing in ${DIANN_MACHINE_CONFIG}}"
: "${TMPBASE:?TMPBASE is missing in ${DIANN_MACHINE_CONFIG}}"
: "${PIPELINE_PYTHON_PATH:?PIPELINE_PYTHON_PATH is missing in ${DIANN_MACHINE_CONFIG}}"

# Derive the output version folder from the DIA-NN binary name.
# Examples:
#   diann-2.5.0 -> 2_5_0
#   /opt/diann/diann-2.3.2 -> 2_3_2
DIANN_BIN_NAME="${DIANN_BIN##*/}"
DIANN_VERSION="${DIANN_BIN_NAME#diann-}"
DIANN_VERSION_DIR="${DIANN_VERSION//./_}"
if [[ -z "${OUTBASE+x}" ]]; then
  OUTBASE_AUTO=1
  OUTBASE="${OUTROOT%/}/${DIANN_VERSION_DIR}"
else
  OUTBASE_AUTO=0
fi

LISTBASE="${PIPELINE_ROOT}/lists"              # run lists tracked with the repo

export DIANN_MACHINE DIANN_MACHINE_CONFIG PIPELINE_ROOT PIPELINE_ENV_FILE
